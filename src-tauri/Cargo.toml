[package]
name = "openterm"
version = "0.1.0"
description = "Lightweight Dual SSH & SFTP Client"
authors = ["OpenTerm Contributors"]
edition = "2021"

[lib]
name = "openterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "5.0"
thiserror = "1.0"
