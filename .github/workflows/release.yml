name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: macos-13
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing version to $VERSION"

          # Patch tauri.conf.json
          sed -i.bak 's/"version": *"[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          rm -f src-tauri/tauri.conf.json.bak

          # Patch Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

          # Patch package.json
          sed -i.bak 's/"version": *"[^"]*"/"version": "'"$VERSION"'"/' package.json
          rm -f package.json.bak

          echo "--- tauri.conf.json ---"
          grep '"version"' src-tauri/tauri.conf.json
          echo "--- Cargo.toml ---"
          grep '^version' src-tauri/Cargo.toml
          echo "--- package.json ---"
          grep '"version"' package.json

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenTerm ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
