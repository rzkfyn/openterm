[package]
name = "openterm"
version = "0.7.1"
description = "Lightweight Dual SSH & SFTP Client"
authors = ["OpenTerm Contributors"]
edition = "2021"

[lib]
name = "openterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "5.0"
thiserror = "1.0"
tauri-plugin-dialog = "2.7.3"
ssh-key = { version = "0.7.0-rc.11", features = ["std", "ppk", "crypto", "ed25519", "rsa", "encryption"] }
aes-gcm = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Security_Credentials_UI",
    "Foundation",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = "0.3"
block2 = "0.6"


