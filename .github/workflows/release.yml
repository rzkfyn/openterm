name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: macos-13
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version from git tag
        shell: bash
        run: |
          # Strip leading 'v' from tag: v0.3.0 -> 0.3.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Syncing version to $VERSION"

          # Patch tauri.conf.json
          if command -v python3 &>/dev/null; then
            python3 -c "
import json, sys
with open('src-tauri/tauri.conf.json', 'r') as f:
    cfg = json.load(f)
cfg['version'] = '$VERSION'
with open('src-tauri/tauri.conf.json', 'w') as f:
    json.dump(cfg, f, indent=2)
"
          else
            # Fallback: sed
            sed -i.bak 's/"version": *"[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
          fi

          # Patch Cargo.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak

          # Patch package.json (add version field if missing)
          if command -v python3 &>/dev/null; then
            python3 -c "
import json
with open('package.json', 'r') as f:
    pkg = json.load(f)
pkg['version'] = '$VERSION'
with open('package.json', 'w') as f:
    json.dump(pkg, f, indent=2)
"
          else
            sed -i.bak 's/"version": *"[^"]*"/"version": "'"$VERSION"'"/' package.json
            rm -f package.json.bak
          fi

          echo "--- tauri.conf.json version ---"
          grep '"version"' src-tauri/tauri.conf.json
          echo "--- Cargo.toml version ---"
          grep '^version' src-tauri/Cargo.toml
          echo "--- package.json version ---"
          grep '"version"' package.json

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenTerm ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
